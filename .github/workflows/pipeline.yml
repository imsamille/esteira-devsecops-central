name: Central DevSecOps - SaaS Interno

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Nome do projeto (usado no DefectDojo e identificacao de relatorios)'
        required: true
        type: string
      stack_type:
        description: 'Stack do projeto (node, dotnet, python, java, cpp, go, rust)'
        required: true
        type: string
      run_dast:
        description: 'Executar analise dinamica (DAST) com OWASP ZAP'
        required: false
        type: boolean
        default: false
      dast_target_url:
        description: 'URL alvo para o scan DAST (ex: http://localhost:3000 ou https://staging.exemplo.com)'
        required: false
        type: string
    secrets:
      DEFECTDOJO_URL:
        description: 'URL do DefectDojo (opcional)'
        required: false
      DEFECTDOJO_API_KEY:
        description: 'Token de API do DefectDojo (opcional)'
        required: false

jobs:
  devsecops-pipeline:
    name: DevSecOps Scans & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Code (Codigo do Desenvolvedor)
        uses: actions/checkout@v4
        with:
          path: app-code

      - name: Checkout Security Tools (Central DevSecOps)
        uses: actions/checkout@v4
        with:
          repository: imsamille/esteira-devsecops-central-consolidada
          path: security-tools

      - name: Create Reports Directories
        run: |
          mkdir -p reports/gitleaks reports/semgrep reports/trivy reports/zap

      - name: Preparar ambiente Node.js
        if: inputs.stack_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar dependencias Node.js
        if: inputs.stack_type == 'node'
        working-directory: app-code
        run: npm install || npm ci

      - name: Preparar ambiente .NET
        if: inputs.stack_type == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Instalar dependencias .NET
        if: inputs.stack_type == 'dotnet'
        working-directory: app-code
        run: dotnet restore

      - name: Preparar ambiente Python
        if: inputs.stack_type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Instalar dependencias Python
        if: inputs.stack_type == 'python'
        working-directory: app-code
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Java (Maven/Gradle)
        if: inputs.stack_type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Java Dependencies
        if: inputs.stack_type == 'java'
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install -DskipTests || true
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            ./gradlew build -x test || true
          fi
        working-directory: app-code

      - name: Preparar ambiente C/C++
        if: inputs.stack_type == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Compilar projeto C/C++
        if: inputs.stack_type == 'cpp'
        working-directory: app-code
        run: |
          if [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build && cmake .. && make || true
          elif [ -f "Makefile" ]; then
            make || true
          fi

      - name: Preparar ambiente Go
        if: inputs.stack_type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar dependencias Go
        if: inputs.stack_type == 'go'
        working-directory: app-code
        run: |
          if [ -f go.mod ]; then go mod download; fi

      - name: Preparar ambiente Rust
        if: inputs.stack_type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias Rust
        if: inputs.stack_type == 'rust'
        working-directory: app-code
        run: |
          if [ -f Cargo.toml ]; then cargo fetch || true; fi

      - name: Executar Gitleaks (Shadow Mode)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app-code:/code \
            -v ${{ github.workspace }}/security-tools/security/gitleaks:/config \
            -v ${{ github.workspace }}/reports/gitleaks:/reports \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/code \
            --config=/config/.gitleaks.toml \
            --report-format=json \
            --report-path=/reports/gitleaks-results.json \
            --redact || true

      - name: Executar Semgrep (Shadow Mode)
        run: |
          mkdir -p reports/semgrep
          SEMGREP_CONFIGS="--config p/owasp-top-ten --config /config/rules.yaml"
          INCLUDE_FLAGS=""

          if [ "${{ inputs.stack_type }}" = "node" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/nodejs"
            INCLUDE_FLAGS="--include=*.js --include=*.jsx --include=*.ts --include=*.tsx --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "dotnet" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/csharp"
            INCLUDE_FLAGS="--include=*.cs --include=*.csproj --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "python" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/python"
            INCLUDE_FLAGS="--include=*.py --include=requirements.txt --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "java" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/java"
            INCLUDE_FLAGS="--include=*.java --include=pom.xml --include=*.gradle --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "cpp" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/c"
            INCLUDE_FLAGS="--include=*.c --include=*.cpp --include=*.h --include=*.hpp --include=CMakeLists.txt --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "go" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/golang"
            INCLUDE_FLAGS="--include=*.go --include=go.mod --include=Dockerfile"
          elif [ "${{ inputs.stack_type }}" = "rust" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/rust"
            INCLUDE_FLAGS="--include=*.rs --include=Cargo.toml --include=Dockerfile"
          fi

          docker run --rm \
            -v ${{ github.workspace }}/app-code:/src \
            -v ${{ github.workspace }}/security-tools/security/semgrep:/config \
            -v ${{ github.workspace }}/reports/semgrep:/reports \
            semgrep/semgrep semgrep scan \
            $SEMGREP_CONFIGS \
            $INCLUDE_FLAGS \
            --json \
            --output=/reports/semgrep-results.json \
            /src || true

      - name: Executar Trivy FS (Shadow Mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app-code'
          format: 'json'
          output: 'reports/trivy/trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: ZAP DAST (Shadow Mode)
        if: inputs.run_dast == true && inputs.dast_target_url != ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.dast_target_url }}
          fail_action: false

      - name: Mover relatorios ZAP
        if: inputs.run_dast == true && inputs.dast_target_url != ''
        run: |
          mv report_json.json reports/zap/ 2>/dev/null || true

      - name: Upload Relatorios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-reports
          path: reports/