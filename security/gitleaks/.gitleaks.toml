# configuração personalizada do gitleaks
# define exclusões para reduzir falsos positivos e adiciona regras para detectar possíveis secrets

title = "gitleaks config - esteira devsecops open source"

[extend]
useDefault = true

[allowlist]
description = "arquivos e pastas ignorados para reduzir falsos positivos"

paths = [
    '''(^|/)node_modules/''',
    '''(^|/)reports/''',
    '''(^|/)coverage/''',
    '''(^|/)dist/''',
    '''(^|/)build/''',
    '''(^|/)\.git/''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''npm-shrinkwrap\.json$''',
    '''(^|/)vendor/''',
    '''go\.sum$''',
    '''\.o$''',
    '''\.obj$''',
    '''(^|/)cmake-build-.*/''',
    '''(^|/)target/'''
]

regexes = [
    '''your[_-]?api[_-]?key''',
    '''<API_KEY>''',
    '''INSERT_KEY_HERE''',
    '''FAKE_KEY_FOR_TESTING'''
]


[[rules]]
id = "generic-api-key-custom"
description = "detecta possíveis api keys escritas diretamente no código"
regex = '''(?i)(api_key|apikey|api-key)\s*[:=]\s*['"]?[A-Za-z0-9_\-]{20,}['"]?'''
tags = ["api-key", "secret"]

[rules.allowlist]
description = "ignora placeholders e exemplos sem valor real"
paths = [
    '''(^|/)tests/''',
    '''(^|/)__tests__/''',
    '''(^|/)docs/''',
    '''(^|/)examples/'''
]

regexes = [
    '''your[_-]?api[_-]?key''',
    '''<API_KEY>''',
    '''INSERT_KEY_HERE'''
]

[[rules]]
id = "jwt-secret-custom"
description = "detecta possíveis secrets jwt escritos diretamente no código"
regex = '''(?i)(jwt_secret|jwt[_-]?key|jwtsecret)\s*[:=]\s*['"][^'"]{8,}['"]'''
tags = ["jwt", "secret"]

[rules.allowlist]
description = "ignora valores fictícios usados em testes"
paths = [
    '''(^|/)tests/''',
    '''(^|/)__tests__/'''
]

regexes = [
    '''your[_-]?secret''',
    '''changeme''',
    '''supersecret_test'''
]


# --- REGRA PARA SECRETS EM ARQUIVOS DE CONFIGURAÇÃO (C/C++, Go, .env) ---
[[rules]]
id = "hardcoded-secret-in-config-files"
description = "detecta possíveis secrets hardcoded em arquivos de configuração como config.h, config.go e .env"
regex = '''(?i)(api_key|api_secret|secret_key|auth_token|access_token|private_key|db_password|database_url)\s*[:=]\s*['"]?[A-Za-z0-9_\-/+=]{16,}['"]?'''
path = '''(config\.h|config\.go|\.env|\.env\.\w+|secrets\.go|credentials\.h)$'''
tags = ["config", "secret", "c-cpp", "go"]

[rules.allowlist]
description = "ignora placeholders e valores de exemplo em configs"
regexes = [
    '''your[_-]?api[_-]?key''',
    '''<API_KEY>''',
    '''INSERT_KEY_HERE''',
    '''CHANGE_ME''',
    '''example[_-]?token'''
]
